<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Valentine Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="initial-screen">
        <div class="heart-btn" id="start-btn">❤</div>
        <div
            style="position: absolute; bottom: 20px; color: #ff3366; font-size: 14px; text-align: center; width: 100%;">
            Si ves este texto y el corazón, el HTML y CSS funcionan.<br>
            Abre la consola (F12) y haz clic en el corazón para ver los mensajes.
        </div>
    </div>

    <div id="container">
        <canvas id="treeCanvas"></canvas>
        <div id="ui-layer">
            <div class="message-card" id="message-card">
                <p class="typewriter-text" id="typewriter"></p>
                <div class="counter" id="counter-content">
                    Calculando nuestro tiempo juntos...
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
